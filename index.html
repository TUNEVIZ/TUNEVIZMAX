<head>

    window.addEventListener('error', function(e) {
      var div = document.createElement('div');
      div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c62828;color:#fff;padding:10px 16px;z-index:99999;font-family:monospace;font-size:12px;line-height:1.5;';
      div.textContent = 'JS错误: ' + (e.message || 'unknown') + ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?') + ':' + (e.colno || '?');
      document.body.appendChild(div);

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --glass-opacity: 0.45;
      --glass-bg: rgba(20, 20, 35, var(--glass-opacity));
      --glass-bg-hover: rgba(30, 30, 50, calc(var(--glass-opacity) + 0.2));
      --glass-border: rgba(255, 255, 255, 0.15);
      --text-primary: rgba(255, 255, 255, 0.92);
      --text-secondary: rgba(255, 255, 255, 0.6);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      width:100vw;height:100vh;overflow:hidden;
      background:radial-gradient(ellipse at center,#0b0b1a 0%,#03030a 100%);
      font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
      user-select:none;-webkit-user-select:none;
    }
    #three-canvas{position:fixed;inset:0;z-index:1}
    #ui-layer{
      position:fixed;inset:0;z-index:10;pointer-events:none;
      display:flex;flex-direction:column;justify-content:space-between;padding:20px 30px;
    }
    .top-panel{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
    .glass-card{
      background:var(--glass-bg);backdrop-filter:blur(28px) saturate(180%);
      -webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--glass-border);
      border-radius:18px;padding:14px 20px;box-shadow:0 15px 35px rgba(0,0,0,0.5);
      display:flex;align-items:center;gap:12px;transition:all 0.3s ease;cursor:pointer;
    }
    .glass-card:hover{background:var(--glass-bg-hover);transform:translateY(-2px)}
    .album-art{
      width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,#1e2a3a,#0f0f1e);
      display:flex;align-items:center;justify-content:center;font-size:26px;
      border:1px solid rgba(255,255,255,0.2);
    }
    .album-art.playing{animation:glowPulse 2s infinite}
    @keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(92,156,230,0.5)}50%{box-shadow:0 0 40px rgba(240,123,92,0.8)}}
    .track-info{display:flex;flex-direction:column;gap:2px;min-width:0}
    .track-title{color:var(--text-primary);font-size:1.1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
    .track-artist{color:var(--text-secondary);font-size:0.85rem}
    .time-display{color:var(--text-secondary);font-family:monospace;font-size:0.8rem}
    .mode-switch-group{
      display:flex;gap:4px;background:var(--glass-bg);backdrop-filter:blur(28px);
      border:1px solid var(--glass-border);border-radius:14px;padding:4px;pointer-events:auto;
      position: relative;
    }
    .mode-btn{
      padding:8px 18px;border-radius:10px;border:none;cursor:pointer;font-size:0.85rem;font-weight:500;
      background:transparent;color:var(--text-secondary);transition:all 0.2s ease;
    }
    .mode-btn:hover{color:white}
    .mode-btn.active{background:rgba(40,40,65,0.8);color:white;box-shadow:0 4px 10px rgba(0,0,0,0.3)}
    .progress-wrapper{
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }
    .hifi-tag{
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      font-weight: 500;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      color: transparent;
      background: linear-gradient(
        90deg,
        rgba(255,255,255,0.30) 0%,
        rgba(255,255,255,0.30) 40%,
        rgba(255,255,255,1)    50%,
        rgba(255,255,255,0.30) 60%,
        rgba(255,255,255,0.30) 100%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: hifiShine 5s linear infinite;
      animation-play-state: paused;
    }
    .hifi-tag.visible{
      opacity: 1;
      animation-play-state: running;
    }
    @keyframes hifiShine{
      0%   { background-position:  200% 0; }
      100% { background-position: -200% 0; }
    }
    .progress-container{
      pointer-events:auto;width:100%;background:var(--glass-bg);
      backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:30px;
      padding:10px 18px;box-shadow:0 15px 35px rgba(0,0,0,0.4);display:flex;align-items:center;gap:10px;
    }
    .progress-bar-bg{flex:1;height:6px;background:rgba(255,255,255,0.12);border-radius:10px;cursor:pointer;position:relative;overflow:hidden}
    .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#5c9ce6,#a78bfa,#f07b5c);border-radius:10px;box-shadow:0 0 15px rgba(92,156,230,0.8);transition:width 0.05s linear}
    .bottom-panel{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap}
    .control-btn{
      width:48px;height:48px;border-radius:50%;background:var(--glass-bg);backdrop-filter:blur(28px);
      border:1px solid var(--glass-border);box-shadow:0 10px 25px rgba(0,0,0,0.4);
      display:flex;align-items:center;justify-content:center;cursor:pointer;color:white;font-size:1.3rem;
      transition:all 0.3s ease;
    }
    .control-btn:hover{background:var(--glass-bg-hover);transform:scale(1.05)}
    .control-btn:active{transform:scale(0.95)}
    .play-btn{width:62px;height:62px;font-size:1.8rem;background:linear-gradient(135deg,rgba(92,156,230,0.6),rgba(160,120,240,0.6))}
    #fileInput{position:absolute;opacity:0;pointer-events:none;width:0;height:0;overflow:hidden}
    .playlist-fab{
      position:fixed;bottom:30px;right:30px;z-index:25;pointer-events:auto;
      width:56px;height:56px;border-radius:50%;background:var(--glass-bg);backdrop-filter:blur(24px);
      border:1px solid var(--glass-border);box-shadow:0 10px 30px rgba(0,0,0,0.5);
      display:flex;align-items:center;justify-content:center;cursor:pointer;color:white;font-size:1.8rem;
    }
    .playlist-fab:hover{transform:scale(1.1);background:var(--glass-bg-hover)}
    .playlist-panel{
      position:fixed;bottom:100px;right:30px;z-index:24;pointer-events:none;
      width:300px;max-height:400px;background:var(--glass-bg);
      backdrop-filter:blur(30px);border:1px solid var(--glass-border);
      border-radius:18px;box-shadow:0 15px 35px rgba(0,0,0,0.6);
      padding:10px;display:none;flex-direction:column;gap:4px;overflow-y:auto;
    }
    .playlist-panel.open{display:flex;pointer-events:auto;animation:slideInRight 0.3s ease-out}
    .playlist-panel.closing{animation:slideOutRight 0.3s ease-in forwards}
    @keyframes slideInRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
    @keyframes slideOutRight{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(30px)}}
    .playlist-item{
      padding:10px 14px;border-radius:12px;cursor:pointer;color:var(--text-primary);
      font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      transition:background 0.2s ease,transform 0.2s ease;background:rgba(255,255,255,0.05);border:1px solid transparent;
    }
    .playlist-item:hover{background:var(--glass-bg-hover);border-color:rgba(255,255,255,0.2);transform:translateX(5px)}
    .playlist-item.active{background:rgba(92,156,230,0.3);border-color:#5c9ce6;color:white}
    .playlist-overlay{position:fixed;inset:0;z-index:23;display:none;pointer-events:auto;background:transparent;backdrop-filter:blur(2px)}
    .playlist-overlay.active{display:block}
    .settings-panel{
      position:fixed;right:-400px;top:0;bottom:0;width:360px;background:rgba(10,10,25,0.9);
      backdrop-filter:blur(40px);border-left:1px solid var(--glass-border);
      z-index:20;padding:25px 20px;transition:right 0.4s cubic-bezier(0.4,0,0.2,1);overflow-y:auto;
      display:flex;flex-direction:column;gap:18px;pointer-events:auto;
    }
    .settings-panel.open{right:0}
    .settings-header{display:flex;justify-content:space-between;align-items:center}
    .settings-title{color:white;font-size:1.3rem}
    .settings-close-btn{background:none;border:1px solid rgba(255,255,255,0.2);color:white;width:32px;height:32px;border-radius:8px;cursor:pointer}
    .setting-group{display:flex;flex-direction:column;gap:6px}
    .setting-label{color:var(--text-secondary);font-size:0.75rem;text-transform:uppercase}
    .setting-slider{width:100%;height:5px;background:rgba(255,255,255,0.2);border-radius:5px;-webkit-appearance:none}
    .setting-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:white;border-radius:50%}
    .setting-check{display:flex;align-items:center;gap:8px;color:white;font-size:0.9rem}
    .perf-mode-label{color:#ff8a65;font-weight:600}
    .setting-divider{height:1px;background:rgba(255,255,255,0.1);margin:4px 0}
    .audio-processing-section{background:rgba(255,255,255,0.05);border-radius:12px;padding:12px}
    .audio-processing-title{color:white;font-size:0.9rem;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
    .reset-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:0.7rem}
    .perf-monitor{
      position:fixed;left:30px;bottom:90px;z-index:26;
      background:rgba(10,10,20,0.8);backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.2);border-radius:12px;
      padding:8px 14px;color:rgba(255,255,255,0.9);font-family:monospace;
      font-size:0.75rem;line-height:1.4;pointer-events:auto;cursor:grab;
      user-select:none;transition:font-size 0.3s ease,padding 0.3s ease;
      box-shadow:0 8px 20px rgba(0,0,0,0.4);touch-action:none;
    }
    .perf-monitor.perf-large{font-size:0.9rem;padding:10px 18px}
    .perf-monitor:active{cursor:grabbing}
    .perf-monitor span{display:block;white-space:nowrap}
    .toast{
      position:fixed;top:30px;left:50%;transform:translateX(-50%);
      background:rgba(200,60,60,0.9);color:white;padding:12px 24px;
      border-radius:8px;font-size:0.9rem;z-index:100;pointer-events:none;
      opacity:0;transition:opacity 0.3s ease,transform 0.3s ease;
      box-shadow:0 4px 15px rgba(0,0,0,0.4);
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .debug-panel{
      position:fixed;top:30px;left:30px;z-index:27;
      background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.3);border-radius:8px;
      padding:12px;font-family:monospace;font-size:0.7rem;color:#0f0;
      pointer-events:auto;display:none;min-width:280px;max-height:70vh;
      overflow-y:auto;box-shadow:0 4px 15px rgba(0,0,0,0.3);white-space:pre-wrap;
    }
    .debug-panel.visible{display:block}
    .debug-log-btn{
      background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);
      color:white;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:0.7rem;margin-top:8px;
    }
    .debug-log-btn:hover{background:rgba(255,255,255,0.2)}
    .debug-log-content{
      margin-top:8px;padding:8px;background:rgba(0,0,0,0.5);
      border-radius:4px;max-height:200px;overflow-y:auto;display:none;
    }
    .debug-log-content.open{display:block}
    .playlist-tabs{display:flex;gap:4px;margin-bottom:8px;}
    .playlist-tab{padding:6px 12px;border-radius:8px;cursor:pointer;font-size:0.8rem;background:rgba(255,255,255,0.05);color:var(--text-secondary);border:1px solid transparent;transition:all 0.2s ease;}
    .playlist-tab:hover{background:rgba(255,255,255,0.1)}
    .playlist-tab.active{background:rgba(92,156,230,0.3);color:white;border-color:#5c9ce6;}
    .lyric-color-picker{display:flex;align-items:center;gap:8px;}
    .lyric-color-picker input[type="color"]{width:40px;height:30px;border:none;border-radius:4px;cursor:pointer;background:none;}
    .style-btn{
      background:rgba(255,255,255,0.1);
      border:1px solid rgba(255,255,255,0.2);
      color:white;
      padding:10px 16px;
      border-radius:8px;
      cursor:pointer;
      font-size:0.9rem;
      transition:all 0.2s ease;
      width:100%;
      text-align:center;
    }
    .style-btn:hover{background:rgba(255,255,255,0.2)}
  </style>
</head>
<body>
  <canvas id="three-canvas"></canvas>
  <input type="file" id="fileInput" multiple>

  <div id="ui-layer">
    <div class="top-panel">
      <div class="glass-card" id="songCard">
        <div class="album-art" id="albumArt">🎵</div>
        <div class="track-info">
          <div class="track-title" id="trackTitle">未选择音频</div>
          <div class="track-artist" id="trackArtist">点击右下角📂批量导入</div>
          <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
        </div>
      </div>
      <div class="mode-switch-group">
        <button class="mode-btn active" data-mode="particle">粒子</button>
        <button class="mode-btn" data-mode="spectrum">频谱</button>
        <button class="mode-btn" data-mode="both">混合</button>
        <button class="mode-btn" data-mode="vinyl">黑胶</button>
      </div>
    </div>
    <div style="flex:1;"></div>
    <div class="progress-wrapper">
      <div class="hifi-tag" id="hifiTag">高清音质 · 智能调音</div>
      <div class="progress-container">
        <span style="color:white;font-family:monospace" id="currentTimeLabel">00:00</span>
        <div class="progress-bar-bg" id="progressBarBg"><div class="progress-fill" id="progressFill"></div></div>
        <span style="color:white;font-family:monospace" id="durationLabel">00:00</span>
      </div>
    </div>
    <div class="bottom-panel">
      <button class="control-btn" id="btnPrev">⏮️</button>
      <button class="control-btn play-btn" id="btnPlay">▶️</button>
      <button class="control-btn" id="btnNext">⏭️</button>
      <button class="control-btn" id="btnSettings">⚙️</button>
      <button class="control-btn" id="btnLoadFile">📂</button>
    </div>
  </div>

  <div class="playlist-overlay" id="playlistOverlay"></div>
  <div class="playlist-fab" id="playlistFab">🎶</div>
  <div class="playlist-panel" id="playlistPanel"></div>
  <div class="perf-monitor" id="perfMonitor"><span>FPS: --</span><span>CPU: --%</span><span>MEM: --</span></div>
  <div class="debug-panel" id="debugPanel"></div>
  <div class="toast" id="toast"></div>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header"><span class="settings-title">设置</span><button class="settings-close-btn" id="btnCloseSettings">✕</button></div>
    <div class="setting-group"><span class="setting-label">玻璃透明度</span><input type="range" class="setting-slider" id="glassOpacity" min="0.1" max="0.9" value="0.45" step="0.05"></div>
    <div class="setting-group"><span class="setting-label">粒子数量</span><input type="range" class="setting-slider" id="particleCount" min="1000" max="20000" value="8000" step="100"></div>
    <div class="setting-group"><span class="setting-label">粒子大小</span><input type="range" class="setting-slider" id="particleSize" min="0.1" max="2" value="0.7" step="0.05"></div>
    <div class="setting-group"><span class="setting-label">频谱柱数</span><input type="range" class="setting-slider" id="barCount" min="64" max="1000" value="512" step="8"></div>
    <div class="setting-group"><span class="setting-label">频谱灵敏度</span><input type="range" class="setting-slider" id="spectrumGain" min="0.5" max="8" value="4.0" step="0.1"></div>
    <div class="setting-group"><span class="setting-label">频谱平滑</span><input type="range" class="setting-slider" id="spectrumSmooth" min="0.1" max="0.95" value="0.55" step="0.01"></div>
    <div class="setting-group"><span class="setting-label">震动强度</span><input type="range" class="setting-slider" id="shakeIntensity" min="0" max="2" value="0.8" step="0.1"></div>
    <div class="setting-group"><span class="setting-label">歌词颜色</span><div class="lyric-color-picker"><input type="color" id="lyricColor" value="#ffffff"></div></div>
    <div class="setting-check"><input type="checkbox" id="lyricToggle">显示歌词</div>
    <div class="setting-check"><input type="checkbox" id="bloomToggle" checked>辉光</div>
    <div class="setting-check"><input type="checkbox" id="shakeToggle" checked>鼓点震动</div>
    <div class="setting-check"><input type="checkbox" id="autoRotateToggle" checked>自动旋转</div>
    <div class="setting-check"><input type="checkbox" id="debugToggle">Debug模式</div>
    <div class="setting-divider"></div>
    <div class="setting-check"><input type="checkbox" id="perfModeToggle"><span class="perf-mode-label">⚡ 性能模式</span></div>
    <div style="color:var(--text-secondary);font-size:0.7rem;margin-top:-12px;padding-left:26px;">柱子上限10000 · 粒子50000 · 灵敏度x20 · 震动x5</div>
    <div class="setting-divider"></div>
    <div class="audio-processing-section">
      <div class="audio-processing-title">音频处理<button class="reset-btn" id="resetAudioBtn">复位</button></div>
      <div class="setting-group"><span class="setting-label">声伴比例</span><input type="range" class="setting-slider" id="vocalMix" min="-1" max="1" value="0" step="0.01"></div>
      <div class="setting-group" style="margin-top:10px;"><span class="setting-label">左右声道平衡</span><input type="range" class="setting-slider" id="balanceSlider" min="-1" max="1" value="0" step="0.01"></div>
      <div class="setting-group" style="margin-top:10px;"><span class="setting-label">音调</span><input type="range" class="setting-slider" id="pitchSlider" min="0.5" max="1.5" value="1.0" step="0.01"></div>
    </div>
    <div class="setting-divider"></div>
    <button class="style-btn" id="styleSwitchBtn">选择播放器样式</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    const ShakeShader = {
      uniforms: { tDiffuse:{value:null}, uShakeX:{value:0}, uShakeY:{value:0} },
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`uniform sampler2D tDiffuse; uniform float uShakeX,uShakeY; varying vec2 vUv; void main(){ vec2 uv=vUv+vec2(uShakeX,uShakeY); gl_FragColor=texture2D(tDiffuse,uv); }`
    };

    const PERF_LIMITS = {
      particleCount: { defaultMax: 20000, perfMax: 50000 },
      particleSize: { defaultMax: 2, perfMax: 5 },
      barCount: { defaultMax: 1000, perfMax: 10000 },
      spectrumGain: { defaultMax: 8, perfMax: 20 },
      shakeIntensity: { defaultMax: 2, perfMax: 5 }
    };

    const SMART_EQ_BANDS = [
      { freq: 31,    gain: -1 },
      { freq: 62,    gain: +1 },
      { freq: 125,   gain: +1 },
      { freq: 250,   gain: -2 },
      { freq: 500,   gain: -1 },
      { freq: 1000,  gain: +1 },
      { freq: 2000,  gain: -1 },
      { freq: 4000,  gain: +2 },
      { freq: 8000,  gain: +1 },
      { freq: 16000, gain: +1 }
    ];

    function showToast(message) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toast._hideTimer);
      toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function parseLRC(text) {
      const lines = text.split(/\r?\n/);
      const result = [];
      for (const line of lines) {
        const match = line.match(/\[(\d{2}):(\d{2})\.(\d{1,3})\](.*)/);
        if (match) {
          const minutes = parseInt(match[1]);
          const seconds = parseInt(match[2]);
          const millis = parseInt(match[3].padEnd(3, '0'));
          const time = minutes * 60 + seconds + millis / 1000;
          const lyric = match[4].trim();
          result.push({ time, lyric });
        }
      }
      return result.sort((a, b) => a.time - b.time);
    }

    function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsText(file, 'UTF-8');
      });
    }

    class AudioEngine {
      constructor() {
        this.ctx=null; this.source=null; this.element=null;
        this.analyser=null; this.stereoPanner=null;
        this.splitter=null; this.midGain=null; this.sideGain=null;
        this.midSum=null; this.sideDiff=null; this.midMerger=null; this.sideMerger=null;
        this.sideLeft=null; this.sideRight=null;
        this.eqNodes = [];
        this.freqData=null; this.timeData=null;
        this.fftSize=2048; this.isPlaying=false;
        this.duration=0;
        this._startTime=0; this._pauseTime=0;
        this._playbackRate=1.0;
        this._pitchDebounceTimer=null;
        this.energyHistory=[]; this.beatCallback=null;
        this._playAttempted = false;

        this.BEAT_RISE_RATIO = 1.5;
        this.BEAT_MIN_ENERGY = 0.05;
        this.BEAT_COOLDOWN_MS = 75;
        this.BEAT_HISTORY_FRAMES = 60;
        this.BEAT_MIN_HISTORY_FRAMES = 18;
        this.BEAT_OVERRIDE_RATIO = 1.1;
        this.BEAT_STRENGTH_DIVISOR = 0.5;

        this._lastBeatTime = 0;
        this._lastBeatRatio = 0;
      }
      async init() {
        if (this.ctx) return;
        try {
          this.ctx = new AudioContext();
          this.analyser = this.ctx.createAnalyser();
          this.analyser.fftSize = this.fftSize;
          this.analyser.smoothingTimeConstant = 0.8;
          this.freqData = new Uint8Array(this.analyser.frequencyBinCount);
          this.timeData = new Uint8Array(this.analyser.fftSize);
          this.element = new Audio();
          this.element.crossOrigin = 'anonymous';
          this.source = this.ctx.createMediaElementSource(this.element);
          this.source.connect(this.analyser);
          this.splitter = this.ctx.createChannelSplitter(2);
          this.analyser.connect(this.splitter);
          const gainL_mid = this.ctx.createGain(); gainL_mid.gain.value = 0.5;
          const gainR_mid = this.ctx.createGain(); gainR_mid.gain.value = 0.5;
          const gainL_side = this.ctx.createGain(); gainL_side.gain.value = 0.5;
          const gainR_side = this.ctx.createGain(); gainR_side.gain.value = -0.5;
          this.midSum = this.ctx.createGain();
          this.sideDiff = this.ctx.createGain();
          this.splitter.connect(gainL_mid, 0);
          this.splitter.connect(gainR_mid, 1);
          this.splitter.connect(gainL_side, 0);
          this.splitter.connect(gainR_side, 1);
          gainL_mid.connect(this.midSum);
          gainR_mid.connect(this.midSum);
          gainL_side.connect(this.sideDiff);
          gainR_side.connect(this.sideDiff);
          this.midMerger = this.ctx.createChannelMerger(2);
          this.midSum.connect(this.midMerger, 0, 0);
          this.midSum.connect(this.midMerger, 0, 1);
          this.sideMerger = this.ctx.createChannelMerger(2);
          this.sideLeft = this.ctx.createGain();
          this.sideRight = this.ctx.createGain();
          this.sideLeft.gain.value = 1;
          this.sideRight.gain.value = -1;
          this.sideDiff.connect(this.sideLeft);
          this.sideDiff.connect(this.sideRight);
          this.sideLeft.connect(this.sideMerger, 0, 0);
          this.sideRight.connect(this.sideMerger, 0, 1);
          this.midGain = this.ctx.createGain();
          this.sideGain = this.ctx.createGain();
          this.midMerger.connect(this.midGain);
          this.sideMerger.connect(this.sideGain);
          this.stereoPanner = this.ctx.createStereoPanner();
          this.midGain.connect(this.stereoPanner);
          this.sideGain.connect(this.stereoPanner);

          this.eqNodes = SMART_EQ_BANDS.map(band => {
            const f = this.ctx.createBiquadFilter();
            f.type = 'peaking';
            f.frequency.value = band.freq;
            f.Q.value = 1.0;
            f.gain.value = band.gain;
            return f;
          });
          this.stereoPanner.connect(this.eqNodes[0]);
          for (let i = 0; i < this.eqNodes.length - 1; i++) {
            this.eqNodes[i].connect(this.eqNodes[i + 1]);
          }
          this.eqNodes[this.eqNodes.length - 1].connect(this.ctx.destination);

          this.setVocalMix(0);
          this.setBalance(0);
          this.setPitch(1.0);
        } catch (err) { showToast('音频初始化失败: ' + err.message); }
      }
      unlock() {
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') {
          this.ctx.resume().catch(()=>{});
        }
      }
      async getDuration(file) {
        await this.init();
        return new Promise((resolve, reject) => {
          const tempAudio = new Audio();
          tempAudio.preload = 'metadata';
          const url = URL.createObjectURL(file);
          tempAudio.src = url;
          tempAudio.load();
          tempAudio.onloadedmetadata = () => { const dur = tempAudio.duration; URL.revokeObjectURL(url); resolve(dur); };
          tempAudio.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`无法解码: ${file.name}`)); };
        });
      }
      playFile(file) {
        if (!this.ctx) return;
        this.unlock();
        const url = URL.createObjectURL(file);
        this.element.src = url;
        try {
          const playPromise = this.element.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              this.isPlaying = true;
              this._startTime = performance.now();
              this._pauseTime = 0;
              this.updatePlayButton(true);
              this._playAttempted = false;
            }).catch(err => {
              this.isPlaying = false;
              this.updatePlayButton(false);
              showToast('播放失败: ' + err.message);
            });
          }
        } catch (err) {
          showToast('播放失败: ' + err.message);
          this.updatePlayButton(false);
        }
        this.element.onloadedmetadata = () => {
          this.duration = this.element.duration;
          document.getElementById('durationLabel').textContent = this.fmt(this.duration);
        };
      }
      play() {
        if (!this.ctx) return;
        this.unlock();
        try {
          const playPromise = this.element.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              this.isPlaying = true;
              this._startTime = performance.now() - (this._pauseTime * 1000 / this._playbackRate);
              this.updatePlayButton(true);
              this._playAttempted = false;
            }).catch(err => {
              const msg = err.message || '';
              if (msg.includes('not allowed') || msg.includes('denied') || msg.includes('permission')) {
                this.isPlaying = false;
                this.updatePlayButton(false);
                if (!this._playAttempted) {
                  this._playAttempted = true;
                  showToast('请点击播放按钮开始播放');
                }
              } else {
                showToast('播放失败: ' + err.message);
                this.updatePlayButton(false);
              }
            });
          }
        } catch (err) {
          showToast('播放失败: ' + err.message);
          this.updatePlayButton(false);
        }
      }
      pause() {
        this.element.pause();
        this.isPlaying = false;
        this._pauseTime = this.element.currentTime;
        this.updatePlayButton(false);
      }
      getTime() {
        if (this.isPlaying) {
          const elapsed = (performance.now() - this._startTime) * this._playbackRate / 1000;
          return Math.min(this.duration, Math.max(0, this._pauseTime + elapsed));
        } else return this._pauseTime;
      }
      getProgress() { return this.duration ? Math.min(this.getTime()/this.duration,1) : 0; }
      setTime(seconds) {
        this.element.currentTime = seconds;
        this._pauseTime = seconds;
        if (this.isPlaying) this._startTime = performance.now();
      }
      updatePlayButton(playing) {
        document.getElementById('btnPlay').textContent = playing ? '⏸️' : '▶️';
        if (playing) document.getElementById('albumArt').classList.add('playing');
        else document.getElementById('albumArt').classList.remove('playing');
      }
      fmt(s) { const m=Math.floor(s/60), sec=Math.floor(s%60); return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; }
      updateFreq() { this.analyser?.getByteFrequencyData(this.freqData); }
      updateTime() { this.analyser?.getByteTimeDomainData(this.timeData); }

      detectBeat() {
        if (!this.timeData) return { isBeat: false, strength: 0, energy: 0 };

        let sum = 0;
        for (let i = 0; i < this.timeData.length; i++) {
          const v = (this.timeData[i] - 128) / 128;
          sum += v * v;
        }
        const energy = Math.sqrt(sum / this.timeData.length);

        this.energyHistory.push(energy);
        if (this.energyHistory.length > this.BEAT_HISTORY_FRAMES) {
          this.energyHistory.shift();
        }

        if (this.energyHistory.length < this.BEAT_MIN_HISTORY_FRAMES) return { isBeat: false, strength: 0, energy };

        let histSum = 0;
        for (let i = 0; i < this.energyHistory.length; i++) histSum += this.energyHistory[i];
        const avg = histSum / this.energyHistory.length;

        const ratio = avg > 0.0001 ? energy / avg : 0;

        const now = performance.now();

        const isRising = (ratio > this.BEAT_RISE_RATIO) && (energy > this.BEAT_MIN_ENERGY);

        if (!isRising) {
          if (ratio < 1.0) {
            this._lastBeatRatio = 0;
          }
          return { isBeat: false, strength: 0, energy };
        }

        const rawStrength = (ratio - this.BEAT_RISE_RATIO) * energy;
        let strength = Math.min(1, rawStrength / this.BEAT_STRENGTH_DIVISOR);
        strength = Math.max(0.3, strength);

        const timeSinceLastBeat = now - this._lastBeatTime;

        if (timeSinceLastBeat < this.BEAT_COOLDOWN_MS) {
          if (ratio > this._lastBeatRatio * this.BEAT_OVERRIDE_RATIO) {
            this._lastBeatTime = now;
            this._lastBeatRatio = ratio;
            this.beatCallback?.(strength);
            return { isBeat: true, strength, energy };
          }
          return { isBeat: false, strength: 0, energy };
        }

        this._lastBeatTime = now;
        this._lastBeatRatio = ratio;
        this.beatCallback?.(strength);
        return { isBeat: true, strength, energy };
      }

      setBalance(val) { if (this.stereoPanner) this.stereoPanner.pan.value = val; }
      setVocalMix(val) {
        if (this.midGain && this.sideGain) {
          const midGain = 1 - Math.max(0, -val);
          const sideGain = 1 - Math.max(0, val);
          this.midGain.gain.value = midGain;
          this.sideGain.gain.value = sideGain;
        }
      }
      setPitch(val) {
        if (this._pitchDebounceTimer) clearTimeout(this._pitchDebounceTimer);
        this._pitchDebounceTimer = setTimeout(() => {
          this._playbackRate = val;
          if (this.element) {
            const currentTime = this.getTime();
            this.element.playbackRate = val;
            this._pauseTime = currentTime;
            if (this.isPlaying) this._startTime = performance.now();
          }
        }, 150);
      }
    }

    class Playlist {
      constructor(audioEngine, onSongChange) {
        this.audio = audioEngine;
        this.songs = [];
        this.lyrics = [];
        this.currentIndex = -1;
        this.currentLyricIndex = -1;
        this.onSongChange = onSongChange;
        this.coverCallback = null;
        this.lyricCallback = null;
        this.activeTab = 'songs';
        this.loadedIndex = -1;
      }
      async addFiles(files) {
        let addedSong = 0;
        let addedLyric = 0;
        for (const file of files) {
          const fileName = file.name.toLowerCase();
          if (fileName.endsWith('.lrc')) {
            try {
              const text = await readFileAsText(file);
              const parsed = parseLRC(text);
              if (parsed.length > 0) {
                this.lyrics.push({ name: file.name.replace(/\.lrc$/i, ''), data: parsed });
                addedLyric++;
              } else {
                showToast('LRC解析失败或为空: ' + file.name);
              }
            } catch (e) { showToast('读取LRC失败: ' + file.name); }
          } else {
            try {
              const duration = await this.audio.getDuration(file);
              this.songs.push({ name: file.name.replace(/\.[^/.]+$/, ''), file, duration });
              addedSong++;
            } catch (e) { showToast(e.message); }
          }
        }
        if (addedSong > 0 && this.currentIndex === -1) {
          this.currentIndex = 0;
        }
        if (addedLyric > 0) {
          if (this.currentLyricIndex === -1) this.applyLyric(0);
          const lyricToggle = document.getElementById('lyricToggle');
          if (lyricToggle && !lyricToggle.checked) {
            lyricToggle.checked = true;
            this.lyricToggleEvent?.();
          }
        }
        this.renderPanel();
        if (addedSong > 0) showToast('已导入歌曲，点击播放按钮开始播放');
      }
      // === 自动匹配同名 lrc：先完全同名，再忽略大小写 ===
      _autoMatchLyric(songName) {
        if (!songName || this.lyrics.length === 0) {
          this.currentLyricIndex = -1;
          this.lyricCallback?.([]);
          return;
        }
        let matchIdx = this.lyrics.findIndex(l => l.name === songName);
        if (matchIdx === -1) {
          const lower = songName.toLowerCase();
          matchIdx = this.lyrics.findIndex(l => l.name.toLowerCase() === lower);
        }
        if (matchIdx !== -1) {
          this.currentLyricIndex = matchIdx;
          this.lyricCallback?.(this.lyrics[matchIdx].data);
        } else {
          this.currentLyricIndex = -1;
          this.lyricCallback?.([]);
        }
      }
      playSong(index) {
        if (index < 0 || index >= this.songs.length) return;
        this.currentIndex = index;
        const song = this.songs[index];
        this.audio.playFile(song.file);
        this.loadedIndex = index;
        this.onSongChange?.(song);

        // === 自动应用同名 lrc ===
        this._autoMatchLyric(song.name);

        this.renderPanel();
        if (this.coverCallback) this.coverCallback(null);
        if (song.file.name.toLowerCase().endsWith('.mp3')) this.extractMP3Cover(song.file);
      }
      applyLyric(index) {
        if (index < 0 || index >= this.lyrics.length) return;
        this.currentLyricIndex = index;
        if (this.lyricCallback) this.lyricCallback(this.lyrics[index].data);
        this.renderPanel();
      }
      async extractMP3Cover(file) {
        if (window.jsmediatags) {
          window.jsmediatags.read(file, {
            onSuccess: (tag) => {
              const image = tag.tags.picture;
              if (image && image.data && image.data.length > 0) {
                const blob = new Blob([new Uint8Array(image.data)], { type: image.format });
                const url = URL.createObjectURL(blob);
                if (this.coverCallback) this.coverCallback(url);
              }
            },
            onError: (error) => showToast('封面提取失败: ' + error.message)
          });
        }
      }
      next() { if (this.songs.length) this.playSong((this.currentIndex+1)%this.songs.length); }
      prev() { if (this.songs.length) this.playSong((this.currentIndex-1+this.songs.length)%this.songs.length); }
      setTab(tab) { this.activeTab = tab; this.renderPanel(); }
      renderPanel() {
        const panel = document.getElementById('playlistPanel');
        panel.innerHTML = '';
        const tabs = document.createElement('div');
        tabs.className = 'playlist-tabs';
        const songsTab = document.createElement('div');
        songsTab.className = 'playlist-tab' + (this.activeTab === 'songs' ? ' active' : '');
        songsTab.textContent = '歌曲';
        songsTab.addEventListener('click', () => { this.setTab('songs'); });
        const lyricsTab = document.createElement('div');
        lyricsTab.className = 'playlist-tab' + (this.activeTab === 'lyrics' ? ' active' : '');
        lyricsTab.textContent = '歌词';
        lyricsTab.addEventListener('click', () => { this.setTab('lyrics'); });
        tabs.appendChild(songsTab);
        tabs.appendChild(lyricsTab);
        panel.appendChild(tabs);
        if (this.activeTab === 'songs') {
          if (this.songs.length === 0) {
            panel.innerHTML += '<div style="color:white;padding:10px;text-align:center;">暂无歌曲</div>';
          } else {
            this.songs.forEach((song, i) => {
              const item = document.createElement('div');
              item.className = 'playlist-item' + (i === this.currentIndex ? ' active' : '');
              item.textContent = song.name;
              item.title = song.name;
              item.addEventListener('click', (e) => { e.stopPropagation(); this.playSong(i); });
              panel.appendChild(item);
            });
          }
        } else {
          if (this.lyrics.length === 0) {
            panel.innerHTML += '<div style="color:white;padding:10px;text-align:center;">暂无歌词</div>';
          } else {
            this.lyrics.forEach((lyric, i) => {
              const item = document.createElement('div');
              item.className = 'playlist-item' + (i === this.currentLyricIndex ? ' active' : '');
              item.textContent = lyric.name;
              item.title = lyric.name;
              item.addEventListener('click', (e) => { e.stopPropagation(); this.applyLyric(i); });
              panel.appendChild(item);
            });
          }
        }
      }
      togglePanel() {
        const panel = document.getElementById('playlistPanel');
        const overlay = document.getElementById('playlistOverlay');
        if (panel.classList.contains('open')) {
          panel.classList.add('closing');
          panel.classList.remove('open');
          overlay.classList.remove('active');
          setTimeout(() => { panel.classList.remove('closing'); panel.style.display = 'none'; }, 300);
        } else {
          this.renderPanel();
          panel.style.display = 'flex';
          panel.classList.add('open');
          overlay.classList.add('active');
        }
      }
    }

    class ParticleSystem {
      constructor(scene) {
        this.scene=scene; this.count=8000; this.visible=true;
        this.geo=new THREE.BufferGeometry(); this.points=null;
        this.pos=null; this.col=null; this.siz=null; this.vel=null; this.life=null;
        this.trails=[]; this.maxLife=3.2;
        this.hasCover = false; this.coverSampleFunc = null;
        this.init();
      }
      init() {
        if (this.points) { this.scene.remove(this.points); this.points.geometry.dispose(); this.points.material.dispose(); }
        this.trails.forEach(t=>{ this.scene.remove(t.line); t.line.geometry.dispose(); t.line.material.dispose(); });
        this.trails=[];
        const n=this.count;
        this.pos=new Float32Array(n*3); this.col=new Float32Array(n*3); this.siz=new Float32Array(n);
        this.vel=new Float32Array(n*3); this.life=new Float32Array(n);
        for(let i=0;i<n;i++) this.reset(i,true);
        this.geo=new THREE.BufferGeometry();
        this.geo.setAttribute('position',new THREE.BufferAttribute(this.pos,3));
        this.geo.setAttribute('color',new THREE.BufferAttribute(this.col,3));
        this.geo.setAttribute('size',new THREE.BufferAttribute(this.siz,1));
        this.mat=new THREE.ShaderMaterial({
          uniforms:{uPixelRatio:{value:Math.min(devicePixelRatio,2)}},
          vertexShader:`attribute float size; attribute vec3 color; varying vec3 vColor; uniform float uPixelRatio;
            void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=size*uPixelRatio*(180.0/-mv.z); gl_Position=projectionMatrix*mv; vColor=color; }`,
          fragmentShader:`varying vec3 vColor; void main(){ float d=length(gl_PointCoord-0.5); if(d>0.5) discard; gl_FragColor=vec4(vColor,0.5); }`,
          transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
        });
        this.points=new THREE.Points(this.geo,this.mat);
        this.points.visible = this.visible;
        this.scene.add(this.points);
        const trailMat = new THREE.LineBasicMaterial({color:0x5577aa, transparent:true, opacity:0.1, blending:THREE.AdditiveBlending});
        for (let i=0; i<Math.min(100,this.count); i++) {
          const g = new THREE.BufferGeometry(); const arr = new Float32Array(6*3);
          g.setAttribute('position', new THREE.BufferAttribute(arr,3)); g.setDrawRange(0,0);
          const line = new THREE.Line(g, trailMat); line.frustumCulled=false;
          this.scene.add(line); this.trails.push({line, pos:arr, hist:[]});
        }
      }
      reset(i,rz){
        const i3=i*3, r=6+Math.random()*10, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
        this.pos[i3]=Math.cos(th)*Math.sin(ph)*r; this.pos[i3+1]=Math.sin(th)*Math.sin(ph)*r*0.6;
        this.pos[i3+2]=rz?(Math.random()-0.5)*18:Math.cos(ph)*r;
        if (this.hasCover && this.coverSampleFunc) {
          const nx = (this.pos[i3] / 10 + 1) / 2;
          const ny = (this.pos[i3+1] / 10 + 1) / 2;
          const color = this.coverSampleFunc(nx, ny);
          this.col[i3] = color.r; this.col[i3+1] = color.g; this.col[i3+2] = color.b;
        } else {
          const c=new THREE.Color().setHSL(0.55+Math.random()*0.13,0.8,0.6);
          this.col[i3]=c.r; this.col[i3+1]=c.g; this.col[i3+2]=c.b;
        }
        this.siz[i]=0.08+Math.random()*0.5;
        this.vel[i3]=(Math.random()-0.5)*0.012; this.vel[i3+1]=(Math.random()-0.5)*0.012; this.vel[i3+2]=(Math.random()-0.5)*0.012;
        this.life[i]=Math.random()*this.maxLife;
      }
      updateCoverColors(sampleFunc) {
        this.hasCover = true; this.coverSampleFunc = sampleFunc;
        for (let i=0; i<this.count; i++) {
          const i3=i*3;
          const nx = (this.pos[i3] / 10 + 1) / 2;
          const ny = (this.pos[i3+1] / 10 + 1) / 2;
          const color = sampleFunc(nx, ny);
          this.col[i3] = color.r; this.col[i3+1] = color.g; this.col[i3+2] = color.b;
        }
        this.geo.attributes.color.needsUpdate = true;
      }
      clearCover() {
        this.hasCover = false; this.coverSampleFunc = null;
        for (let i=0; i<this.count; i++) {
          const i3=i*3;
          const c=new THREE.Color().setHSL(0.55+Math.random()*0.13,0.8,0.6);
          this.col[i3]=c.r; this.col[i3+1]=c.g; this.col[i3+2]=c.b;
        }
        this.geo.attributes.color.needsUpdate = true;
      }
      update(dt,freq,beat,szMul=1){
        if(!this.points||!freq) return;
        const lo=this.avg(freq,0,10)/255, mi=this.avg(freq,20,80)/255, hi=this.avg(freq,100,200)/255;
        for(let i=0;i<this.count;i++){
          const i3=i*3; this.life[i]-=dt*0.28;
          if(this.life[i]<=0){ this.reset(i); this.life[i]=this.maxLife; }
          if(beat){ const d=Math.sqrt(this.pos[i3]**2+this.pos[i3+1]**2+this.pos[i3+2]**2); if(d<4.5){ this.vel[i3]+=this.pos[i3]/d*0.1; this.vel[i3+1]+=this.pos[i3+1]/d*0.1; this.vel[i3+2]+=this.pos[i3+2]/d*0.1; } }
          const sp=1+lo*2.0; this.pos[i3]+=this.vel[i3]*sp*dt*18; this.pos[i3+1]+=this.vel[i3+1]*sp*dt*18; this.pos[i3+2]+=this.vel[i3+2]*sp*dt*18;
          if(Math.abs(this.pos[i3])>16) this.vel[i3]*=-0.8; if(Math.abs(this.pos[i3+1])>16) this.vel[i3+1]*=-0.8; if(Math.abs(this.pos[i3+2])>16) this.vel[i3+2]*=-0.8;
          if (!this.hasCover) {
            const e=lo*0.6+mi*0.3+hi*0.1, color=new THREE.Color().setHSL(0.53+e*0.09,0.8,0.4+e*0.3);
            this.col[i3]=color.r; this.col[i3+1]=color.g; this.col[i3+2]=color.b;
          }
          this.siz[i]=Math.max(0.06, (0.15+(this.hasCover?0.3:1.4))*szMul);
        }
        this.geo.attributes.position.needsUpdate=true;
        this.geo.attributes.color.needsUpdate=true;
        this.geo.attributes.size.needsUpdate=true;
        for (let i=0; i<this.trails.length; i++) {
          const t=this.trails[i];
          const p=new THREE.Vector3(this.pos[i*3], this.pos[i*3+1], this.pos[i*3+2]);
          t.hist.push(p); if(t.hist.length>4) t.hist.shift();
          for (let j=0; j<t.hist.length; j++) { t.pos[j*3]=t.hist[j].x; t.pos[j*3+1]=t.hist[j].y; t.pos[j*3+2]=t.hist[j].z; }
          t.line.geometry.attributes.position.needsUpdate=true; t.line.geometry.setDrawRange(0, t.hist.length);
        }
      }
      avg(d,s,e){ if(!d) return 0; let sum=0; for(let i=s;i<=e;i++) sum+=d[i]; return sum/(e-s+1); }
      setCount(n){ this.count=n; this.init(); }
    }

    class RadialSpectrum {
      constructor(scene) {
        this.scene=scene; this.bars=[]; this.barCount=512; this.maxRadius=8.5; this.visible=false;
        this.smoothVals=new Float32Array(this.barCount);
        this.geo=new THREE.BoxGeometry(0.16,1,0.16);
        this.coverSampleFunc = null;
        this.create();
      }
      static makeBarMaterial() {
        const mat = new THREE.MeshStandardMaterial({
          color: 0x4488ff,
          emissive: new THREE.Color(0x335577),
          roughness: 0.3,
          metalness: 0.2,
          transparent: true,
          depthWrite: false
        });
        mat.onBeforeCompile = (shader) => {
          shader.vertexShader = 'varying float vLocalY;\n' + shader.vertexShader;
          shader.vertexShader = shader.vertexShader.replace(
            '#include <begin_vertex>',
            '#include <begin_vertex>\nvLocalY = position.y + 0.5;'
          );
          shader.fragmentShader = 'varying float vLocalY;\n' + shader.fragmentShader;
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <dithering_fragment>',
            '#include <dithering_fragment>\ngl_FragColor.a *= smoothstep(0.0, 0.35, vLocalY);'
          );
        };
        mat.customProgramCacheKey = () => 'barFadeMaterial_v1';
        return mat;
      }
      create(){
        this.bars.forEach(b=>{ this.scene.remove(b); b.material.dispose(); b.geometry.dispose(); });
        this.bars=[];
        const target=this.barCount;
        let layers=Math.round(Math.sqrt(target*0.6)); if(layers<4) layers=4;
        const radii=[], counts=[];
        let est=0;
        for(let l=0;l<layers;l++){ const r=(l+0.3)/layers*this.maxRadius; const c=2*Math.PI*r; let cnt=Math.max(4,Math.round(c/0.48)); radii.push(r); counts.push(cnt); est+=cnt; }
        const factor=target/est;
        for(let l=0;l<layers;l++) counts[l]=Math.max(3,Math.round(counts[l]*factor));
        this.barCount=counts.reduce((a,b)=>a+b,0);
        this.smoothVals=new Float32Array(this.barCount);
        for(let l=0;l<layers;l++){
          const r=radii[l], cnt=counts[l];
          const freqRatio=1-(l/(layers-1));
          for(let i=0;i<cnt;i++){
            const angle=(i/cnt)*Math.PI*2;
            const bar=new THREE.Mesh(this.geo, RadialSpectrum.makeBarMaterial());
            bar.position.set(Math.cos(angle)*r,0,Math.sin(angle)*r);
            bar.userData.freqRatio=freqRatio;
            bar.visible = this.visible;
            this.scene.add(bar); this.bars.push(bar);
          }
        }
        this.smoothVals.fill(0.1);
      }
      updateCoverColors(sampleFunc) {
        this.coverSampleFunc = sampleFunc;
        for (let i=0; i<this.bars.length; i++) {
          const bar = this.bars[i];
          const r = Math.sqrt(bar.position.x*bar.position.x + bar.position.z*bar.position.z);
          const theta = Math.atan2(bar.position.z, bar.position.x);
          const nx = (Math.cos(theta) * r / this.maxRadius + 1) / 2;
          const ny = (Math.sin(theta) * r / this.maxRadius + 1) / 2;
          const color = sampleFunc(nx, ny);
          bar.material.color.setRGB(color.r, color.g, color.b);
          bar.material.emissive.setRGB(color.r*0.3, color.g*0.3, color.b*0.3);
        }
      }
      clearCover() {
        this.coverSampleFunc = null;
        for (let i=0; i<this.bars.length; i++) {
          const bar = this.bars[i];
          const ratio = bar.userData.freqRatio;
          bar.material.color.setHSL(0.55+ratio*0.11,0.9,0.5+ratio*0.3);
          bar.material.emissive.setHSL(0.55+ratio*0.11,0.8,0.2);
        }
      }
      update(freq,gain,smooth){
        if(!freq||this.bars.length===0) return;
        if(this.smoothVals.length!==this.bars.length){ this.smoothVals=new Float32Array(this.bars.length); this.smoothVals.fill(0.1); }
        const fLen=freq.length;
        for(let i=0;i<this.bars.length;i++){
          const bar=this.bars[i], ratio=bar.userData.freqRatio;
          const center=Math.floor(ratio*(fLen-1)), range=Math.max(1,Math.floor(fLen*0.02));
          let sum=0,c=0;
          for(let j=Math.max(0,center-range);j<=Math.min(fLen-1,center+range);j++){ sum+=freq[j]; c++; }
          const avg=sum/c/255, target=Math.max(0.05, avg*7.0*gain);
          this.smoothVals[i]+=(target-this.smoothVals[i])*(1-smooth);
          bar.scale.y=this.smoothVals[i]; bar.position.y=this.smoothVals[i]/2;
          if (!this.coverSampleFunc) {
            bar.material.color.setHSL(0.55+ratio*0.11,0.9,0.5+ratio*0.3);
            bar.material.emissive.setHSL(0.55+ratio*0.11,0.8,0.2);
          }
        }
      }
      setVisible(v){ this.visible=v; this.bars.forEach(b=>b.visible=v); }
      setCount(n){ this.barCount=n; this.create(); }
    }

    class ThreeDLyrics {
      constructor(scene, camera) {
        this.scene = scene;
        this.camera = camera;
        this.lyrics = [];
        this.currentIndex = -1;
        this.lyricColor = '#ffffff';
        this.canvas = document.createElement('canvas');
        this.canvas.width = 1024;
        this.canvas.height = 256;
        this.ctx = this.canvas.getContext('2d');
        this.texture = new THREE.CanvasTexture(this.canvas);
        this.material = new THREE.MeshBasicMaterial({ map: this.texture, transparent: true, side: THREE.DoubleSide, depthWrite: false });
        this.geometry = new THREE.PlaneGeometry(12, 3);
        this.mesh = new THREE.Mesh(this.geometry, this.material);
        this.mesh.position.set(0, 6.5, 7);
        this.mesh.visible = false;
        this.scene.add(this.mesh);
        this._updateTexture();
      }
      setLyrics(lyrics) {
        this.lyrics = lyrics;
        this.currentIndex = -1;
        this._updateTexture();
      }
      setColor(color) {
        this.lyricColor = color;
        this._updateTexture();
      }
      update(time) {
        if (this.lyrics.length === 0) return;
        let newIndex = -1;
        for (let i = 0; i < this.lyrics.length; i++) {
          if (time >= this.lyrics[i].time) newIndex = i;
          else break;
        }
        if (newIndex !== this.currentIndex) {
          this.currentIndex = newIndex;
          this._updateTexture();
        }
        this.mesh.lookAt(this.camera.position);
      }
      _smartWrap(ctx, text, maxWidth, maxLines) {
        const tokens = [];
        let i = 0;
        while (i < text.length) {
          const ch = text[i];
          if (/[A-Za-z0-9'\-]/.test(ch)) {
            let j = i;
            while (j < text.length && /[A-Za-z0-9'\-]/.test(text[j])) j++;
            tokens.push({ text: text.slice(i, j), breakable: true });
            i = j;
            continue;
          }
          if (/\s/.test(ch)) {
            let j = i;
            while (j < text.length && /\s/.test(text[j])) j++;
            tokens.push({ text: text.slice(i, j), breakable: true });
            i = j;
            continue;
          }
          tokens.push({ text: ch, breakable: true });
          i++;
        }

        const lines = [];
        let lineStart = 0;

        while (lineStart < tokens.length) {
          if (lines.length === maxLines - 1) {
            let restText = tokens.slice(lineStart).map(t => t.text).join('');
            if (ctx.measureText(restText).width > maxWidth) {
              while (restText.length > 0 && ctx.measureText(restText + '...').width > maxWidth) {
                restText = restText.slice(0, -1);
              }
              restText = restText + '...';
            }
            lines.push(restText.replace(/\s+$/, ''));
            break;
          }

          let curText = '';
          let lastFit = lineStart;
          let lastBreakFit = -1;
          let j = lineStart;
          while (j < tokens.length) {
            const test = curText + tokens[j].text;
            if (ctx.measureText(test).width <= maxWidth) {
              curText = test;
              j++;
              lastFit = j;
              if (tokens[j - 1].breakable) lastBreakFit = j;
            } else {
              break;
            }
          }

          let breakPoint;
          if (lastBreakFit > lineStart) breakPoint = lastBreakFit;
          else if (lastFit > lineStart) breakPoint = lastFit;
          else breakPoint = lineStart + 1;

          const forbiddenHead = '，。！？；：、）】》」』〕｝〗〙〛>)]}"\'!?,.;:';
          while (breakPoint < tokens.length && forbiddenHead.indexOf(tokens[breakPoint].text[0]) !== -1) {
            breakPoint++;
          }

          const lineText = tokens.slice(lineStart, breakPoint).map(t => t.text).join('').replace(/\s+$/, '');
          lines.push(lineText);
          lineStart = breakPoint;
        }

        return lines;
      }
      _updateTexture() {
        const ctx = this.ctx;
        const W = this.canvas.width;
        const H = this.canvas.height;
        ctx.clearRect(0, 0, W, H);
        const color = this.lyricColor;
        const currentLyric = this.currentIndex >= 0 ? this.lyrics[this.currentIndex].lyric : '';
        const nextLyric = this.currentIndex + 1 < this.lyrics.length ? this.lyrics[this.currentIndex + 1].lyric : '';

        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const MAX_LINES = 2;
        const LINE_YS = [98, 174];
        const NEXT_Y = 222;
        const MAX_WIDTH = W - 40;

        ctx.font = 'bold 72px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
        const displayText = currentLyric || '♪ 暂无歌词 ♪';
        const lines = this._smartWrap(ctx, displayText, MAX_WIDTH, MAX_LINES);

        for (let k = 0; k < lines.length && k < MAX_LINES; k++) {
          ctx.fillText(lines[k], W / 2, LINE_YS[k]);
        }

        if (nextLyric) {
          ctx.font = '40px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
          ctx.globalAlpha = 0.5;
          let nextDisplay = nextLyric;
          if (ctx.measureText(nextDisplay).width > MAX_WIDTH) {
            while (nextDisplay.length > 0 && ctx.measureText(nextDisplay + '...').width > MAX_WIDTH) {
              nextDisplay = nextDisplay.slice(0, -1);
            }
            nextDisplay = nextDisplay + '...';
          }
          ctx.fillText(nextDisplay, W / 2, NEXT_Y);
          ctx.globalAlpha = 1;
        }

        this.texture.needsUpdate = true;
      }
      setVisible(visible) {
        this.mesh.visible = visible;
      }
      dispose() {
        this.scene.remove(this.mesh);
        this.geometry.dispose();
        this.material.dispose();
        this.texture.dispose();
      }
    }

    class BurstParticles {
      constructor(scene, maxCount = 4000) {
        this.scene = scene;
        this.maxCount = maxCount;
        this.cursor = 0;

        this.positions = new Float32Array(maxCount * 3);
        this.colors = new Float32Array(maxCount * 3);
        this.sizes = new Float32Array(maxCount);
        this.alphas = new Float32Array(maxCount);
        this.velocities = new Float32Array(maxCount * 3);
        this.lives = new Float32Array(maxCount);
        this.maxLives = new Float32Array(maxCount);

        for (let i = 0; i < maxCount; i++) {
          this.positions[i*3+1] = -9999;
          this.alphas[i] = 0;
          this.sizes[i] = 0.1;
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(this.colors, 3));
        geo.setAttribute('size', new THREE.BufferAttribute(this.sizes, 1));
        geo.setAttribute('alpha', new THREE.BufferAttribute(this.alphas, 1));

        const mat = new THREE.ShaderMaterial({
          uniforms: { uPixelRatio: { value: Math.min(devicePixelRatio, 2) } },
          vertexShader: `
            attribute float size;
            attribute vec3 color;
            attribute float alpha;
            varying vec3 vColor;
            varying float vAlpha;
            uniform float uPixelRatio;
            void main() {
              vec4 mv = modelViewMatrix * vec4(position, 1.0);
              gl_PointSize = size * uPixelRatio * (300.0 / -mv.z);
              gl_Position = projectionMatrix * mv;
              vColor = color;
              vAlpha = alpha;
            }
          `,
          fragmentShader: `
            varying vec3 vColor;
            varying float vAlpha;
            void main() {
              float d = length(gl_PointCoord - 0.5);
              if (d > 0.5) discard;
              float a = (1.0 - smoothstep(0.25, 0.5, d)) * vAlpha;
              gl_FragColor = vec4(vColor, a);
            }
          `,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

        this.points = new THREE.Points(geo, mat);
        this.points.frustumCulled = false;
        this.scene.add(this.points);
        this.geo = geo;
      }

      burst(count, centerX, centerZ, radius, baseColor, speedMul = 1.0) {
        for (let k = 0; k < count; k++) {
          const i = this.cursor;
          this.cursor = (this.cursor + 1) % this.maxCount;

          const a = Math.random() * Math.PI * 2;
          const px = centerX + Math.cos(a) * radius;
          const pz = centerZ + Math.sin(a) * radius;
          const py = 0.15 + Math.random() * 0.3;

          this.positions[i*3] = px;
          this.positions[i*3+1] = py;
          this.positions[i*3+2] = pz;

          const speed = (2.5 + Math.random() * 4.0) * speedMul;
          const vy = (1.2 + Math.random() * 2.0) * speedMul;
          this.velocities[i*3] = Math.cos(a) * speed;
          this.velocities[i*3+1] = vy;
          this.velocities[i*3+2] = Math.sin(a) * speed;

          if (baseColor) {
            this.colors[i*3] = Math.min(1, baseColor.r * 1.4 + 0.25);
            this.colors[i*3+1] = Math.min(1, baseColor.g * 1.4 + 0.25);
            this.colors[i*3+2] = Math.min(1, baseColor.b * 1.4 + 0.25);
          } else {
            // 蓝色系默认
            const c = new THREE.Color().setHSL(0.55 + Math.random() * 0.13, 0.9, 0.65);
            this.colors[i*3] = c.r;
            this.colors[i*3+1] = c.g;
            this.colors[i*3+2] = c.b;
          }

          this.sizes[i] = (0.12 + Math.random() * 0.16) * Math.min(1.5, speedMul);
          const life = 0.8 + Math.random() * 0.9;
          this.lives[i] = life;
          this.maxLives[i] = life;
          this.alphas[i] = 1.0;
        }
        this.geo.attributes.position.needsUpdate = true;
        this.geo.attributes.color.needsUpdate = true;
        this.geo.attributes.size.needsUpdate = true;
        this.geo.attributes.alpha.needsUpdate = true;
      }

      update(dt) {
        let any = false;
        for (let i = 0; i < this.maxCount; i++) {
          if (this.lives[i] <= 0) continue;
          any = true;
          this.lives[i] -= dt;
          if (this.lives[i] <= 0) {
            this.alphas[i] = 0;
            this.positions[i*3+1] = -9999;
            continue;
          }
          this.velocities[i*3+1] -= 2.0 * dt;
          this.positions[i*3]   += this.velocities[i*3]   * dt;
          this.positions[i*3+1] += this.velocities[i*3+1] * dt;
          this.positions[i*3+2] += this.velocities[i*3+2] * dt;
          const damp = Math.max(0, 1 - 0.9 * dt);
          this.velocities[i*3] *= damp;
          this.velocities[i*3+2] *= damp;
          this.alphas[i] = Math.max(0, this.lives[i] / this.maxLives[i]);
        }
        if (any) {
          this.geo.attributes.position.needsUpdate = true;
          this.geo.attributes.alpha.needsUpdate = true;
        }
      }
    }

      initVinylModel() {
        this.vinylGroup = new THREE.Group();

        const HOLE_R = 0.15;
        const COVER_R = 3.3;
        const TRANSITION_END = 3.5;
        const GROOVE_START = 3.5;
        const GROOVE_END = 4.95;
        const EDGE_END = 5.0;

        const COVER_COUNT = 40000;
        const TRANS_COUNT = 2000;
        const GROOVE_CIRCLES = 100;
        const PARTICLES_PER_GROOVE = 250;
        const EDGE_COUNT = 1500;

        const totalCount = COVER_COUNT + TRANS_COUNT + GROOVE_CIRCLES * PARTICLES_PER_GROOVE + EDGE_COUNT;

        const positions = new Float32Array(totalCount * 3);
        const colors = new Float32Array(totalCount * 3);
        const sizes = new Float32Array(totalCount);
        const types = new Uint8Array(totalCount);

        let idx = 0;

        for (let i = 0; i < COVER_COUNT; i++) {
          const r = Math.sqrt(Math.random() * (COVER_R * COVER_R - HOLE_R * HOLE_R) + HOLE_R * HOLE_R);
          const a = Math.random() * Math.PI * 2;
          positions[idx*3] = Math.cos(a) * r;
          positions[idx*3+1] = 0;
          positions[idx*3+2] = Math.sin(a) * r;
          colors[idx*3] = 0.9;
          colors[idx*3+1] = 0.9;
          colors[idx*3+2] = 0.9;
          sizes[idx] = 0.06;
          types[idx] = 0;
          idx++;
        }

        for (let i = 0; i < TRANS_COUNT; i++) {
          const r = COVER_R + Math.random() * (TRANSITION_END - COVER_R);
          const a = Math.random() * Math.PI * 2;
          positions[idx*3] = Math.cos(a) * r;
          positions[idx*3+1] = 0;
          positions[idx*3+2] = Math.sin(a) * r;
          colors[idx*3] = 0.06;
          colors[idx*3+1] = 0.06;
          colors[idx*3+2] = 0.08;
          sizes[idx] = 0.04;
          types[idx] = 3;
          idx++;
        }

        for (let g = 0; g < GROOVE_CIRCLES; g++) {
          const baseR = GROOVE_START + (g / (GROOVE_CIRCLES - 1)) * (GROOVE_END - GROOVE_START);
          const isBright = (g % 2 === 0);
          const baseColor = isBright ? 0.16 : 0.07;
          const angleStep = (Math.PI * 2) / PARTICLES_PER_GROOVE;
          for (let i = 0; i < PARTICLES_PER_GROOVE; i++) {
            const jitterR = (Math.random() - 0.5) * 0.006;
            const jitterA = (Math.random() - 0.5) * angleStep * 0.7;
            const r = baseR + jitterR;
            const a = i * angleStep + jitterA;
            positions[idx*3] = Math.cos(a) * r;
            positions[idx*3+1] = 0;
            positions[idx*3+2] = Math.sin(a) * r;
            const jitterC = baseColor + Math.random() * 0.02;
            colors[idx*3] = jitterC * 0.85;
            colors[idx*3+1] = jitterC * 0.85;
            colors[idx*3+2] = jitterC;
            sizes[idx] = 0.035;
            types[idx] = 1;
            idx++;
          }
        }

        for (let i = 0; i < EDGE_COUNT; i++) {
          const r = GROOVE_END + Math.random() * (EDGE_END - GROOVE_END);
          const a = Math.random() * Math.PI * 2;
          positions[idx*3] = Math.cos(a) * r;
          positions[idx*3+1] = 0;
          positions[idx*3+2] = Math.sin(a) * r;
          colors[idx*3] = 0.22;
          colors[idx*3+1] = 0.32;
          colors[idx*3+2] = 0.55;
          sizes[idx] = 0.06;
          types[idx] = 2;
          idx++;
        }

        this.vinylParticleRadii = new Float32Array(totalCount);
        this.vinylParticleAngles = new Float32Array(totalCount);
        this.vinylParticleTypes = types;

        for (let i = 0; i < totalCount; i++) {
          const x = positions[i*3];
          const z = positions[i*3+2];
          this.vinylParticleRadii[i] = Math.sqrt(x*x + z*z);
          this.vinylParticleAngles[i] = Math.atan2(z, x);
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const mat = new THREE.ShaderMaterial({
          uniforms: { uPixelRatio: { value: Math.min(devicePixelRatio, 2) } },
          vertexShader: `
            attribute float size;
            attribute vec3 color;
            varying vec3 vColor;
            uniform float uPixelRatio;
            void main() {
              vec4 mv = modelViewMatrix * vec4(position, 1.0);
              gl_PointSize = size * uPixelRatio * (320.0 / -mv.z);
              gl_Position = projectionMatrix * mv;
              vColor = color;
            }
          `,
          fragmentShader: `
            varying vec3 vColor;
            void main() {
              float d = length(gl_PointCoord - 0.5);
              if (d > 0.5) discard;
              float alpha = 1.0 - smoothstep(0.35, 0.5, d);
              gl_FragColor = vec4(vColor, alpha);
            }
          `,
          transparent: true,
          depthWrite: false,
          depthTest: true,
          blending: THREE.NormalBlending
        });

        this.vinylParticles = new THREE.Points(geo, mat);
        this.vinylGroup.add(this.vinylParticles);

        this.vinylParticleCount = totalCount;
        this.vinylCoverRadius = COVER_R;

        this.vinylGroup.visible = false;
        this.scene.add(this.vinylGroup);
      }
      updateVinylCoverParticleColors(sampleFunc) {
        if (!this.vinylParticles) return;
        const colors = this.vinylParticles.geometry.attributes.color.array;
        const count = this.vinylParticleCount;
        const coverR = this.vinylCoverRadius;
        for (let i = 0; i < count; i++) {
          if (this.vinylParticleTypes[i] !== 0) continue;
          const r = this.vinylParticleRadii[i];
          const a = this.vinylParticleAngles[i];
          const x = Math.cos(a) * r;
          const z = Math.sin(a) * r;
          const nx = (x / coverR + 1) / 2;
          const ny = (z / coverR + 1) / 2;
          const c = sampleFunc(nx, ny);
          colors[i*3] = c.r;
          colors[i*3+1] = c.g;
          colors[i*3+2] = c.b;
        }
        this.vinylParticles.geometry.attributes.color.needsUpdate = true;
      }
      clearVinylCoverParticleColors() {
        if (!this.vinylParticles) return;
        const colors = this.vinylParticles.geometry.attributes.color.array;
        const count = this.vinylParticleCount;
        for (let i = 0; i < count; i++) {
          if (this.vinylParticleTypes[i] !== 0) continue;
          colors[i*3] = 0.9;
          colors[i*3+1] = 0.9;
          colors[i*3+2] = 0.9;
        }
        this.vinylParticles.geometry.attributes.color.needsUpdate = true;
      }

        this.scene.add(new THREE.AmbientLight(0x8899bb));

        const dl2 = new THREE.DirectionalLight(0xccddff, 1.0); dl2.position.set(-1,-0.5,-0.5); this.scene.add(dl2);
        const starsGeo = new THREE.BufferGeometry(); const sp = new Float32Array(2500*3);
        for (let i=0;i<2500*3;i+=3){ sp[i]=(Math.random()-0.5)*55; sp[i+1]=(Math.random()-0.5)*35; sp[i+2]=(Math.random()-0.5)*45; }
        starsGeo.setAttribute('position',new THREE.BufferAttribute(sp,3));
        this.scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({color:0xaabbcc, size:0.15, blending:THREE.AdditiveBlending})));
        const renderPass = new RenderPass(this.scene, this.camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.9, 0.4, 0.85);
        bloomPass.strength = 0.6;
        this.bloomPass = bloomPass;
        this.shakePass = new ShaderPass(ShakeShader);
        this.composer.addPass(renderPass);
        this.composer.addPass(bloomPass);
        this.composer.addPass(this.shakePass);

      applyModeVisibility() {

      updateSliderLimits(perfMode) {
        const ids = ['particleCount','particleSize','barCount','spectrumGain','shakeIntensity'];
        const keys = ['particleCount','particleSize','barCount','spectrumGain','shakeIntensity'];
        ids.forEach((id, i) => {
          const slider = document.getElementById(id);
          if (!slider) return;
          const key = keys[i];
          const limits = PERF_LIMITS[key];
          const newMax = perfMode ? limits.perfMax : limits.defaultMax;
          slider.max = newMax;
          if (parseFloat(slider.value) > newMax) slider.value = newMax;
        });
        this.log('性能模式: ' + (perfMode ? '开启' : '关闭'));
      }
      updatePerformanceMonitor(now) {
        const frameDelta = now - this.lastFrameTime;
        this.lastFrameTime = now;
        if (frameDelta > 0) { this.frameTimes.push(frameDelta); if (this.frameTimes.length > 60) this.frameTimes.shift(); }
        if (now - this.lastPerfUpdate >= 1000) {
          const frameCount = this.frameTimes.length;
          const totalTime = this.frameTimes.reduce((a,b)=>a+b,0);
          this.fps = frameCount > 0 ? Math.round(frameCount / (totalTime / 1000)) : 0;
          const avgFrameTime = totalTime / frameCount;
          this.cpuLoad = Math.min(1, Math.max(0, (avgFrameTime - 16.67) / 16.67));
          let memText = 'N/A';
          if (performance.memory) {
            const used = Math.round(performance.memory.usedJSHeapSize / 1048576);
            const limit = Math.round(performance.memory.jsHeapSizeLimit / 1048576);
            memText = `${used} / ${limit} MB`;
          }
          let cpuText = this.cpuLoad < 0.05 ? '<5%' : Math.round(this.cpuLoad * 100) + '%';
          if (this.perfMonitorEl) {
            this.perfMonitorEl.innerHTML = `<span>FPS: ${this.fps}</span><span>CPU: ${cpuText}</span><span>MEM: ${memText}</span>`;
          }
          this.lastPerfUpdate = now; this.frameTimes = [];
        }
      }

      handleCoverImage(url) {
        if (!url) {
          this.spectrum.clearCover();
          this.particles.clearCover();
          this.clearVinylCoverParticleColors();
          this.lastCoverColor = null;
          this.log('清除封面');
          return;
        }
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const size = 128;
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, size, size);
          const imageData = ctx.getImageData(0, 0, size, size);
          const data = imageData.data;
          const sample = (nx, ny) => {
            const x = Math.min(size-1, Math.max(0, nx * (size-1)));
            const y = Math.min(size-1, Math.max(0, ny * (size-1)));
            const x0 = Math.floor(x), y0 = Math.floor(y);
            const x1 = Math.min(size-1, x0+1), y1 = Math.min(size-1, y0+1);
            const dx = x - x0, dy = y - y0;
            const i00 = (y0*size + x0)*4, i10 = (y0*size + x1)*4, i01 = (y1*size + x0)*4, i11 = (y1*size + x1)*4;
            const r = (data[i00]*(1-dx)*(1-dy) + data[i10]*dx*(1-dy) + data[i01]*(1-dx)*dy + data[i11]*dx*dy);
            const g = (data[i00+1]*(1-dx)*(1-dy) + data[i10+1]*dx*(1-dy) + data[i01+1]*(1-dx)*dy + data[i11+1]*dx*dy);
            const b = (data[i00+2]*(1-dx)*(1-dy) + data[i10+2]*dx*(1-dy) + data[i01+2]*(1-dx)*dy + data[i11+2]*dx*dy);
            return { r: r/255, g: g/255, b: b/255 };
          };
          this.spectrum.updateCoverColors(sample);
          this.particles.updateCoverColors(sample);
          this.updateVinylCoverParticleColors(sample);
          this.lastCoverColor = sample(0.5, 0.5);
          this.log('封面已加载');
        };
        img.onerror = () => showToast('封面加载失败');
        img.src = url;
      }

      }
      animate() {
        requestAnimationFrame(()=>this.animate());
        const now = performance.now();
        this.updatePerformanceMonitor(now);
        const dt = Math.min(0.1, this.clock.getDelta());
        this.audio.updateFreq(); this.audio.updateTime();
        const beatInfo = this.audio.detectBeat();
        const beat = beatInfo.isBeat;
        const beatStrength = beatInfo.strength;

        const shouldShowHifi = this.audio.isPlaying && this.playlist.currentIndex !== -1;
        if (shouldShowHifi !== this._hifiShown) {
          this._hifiShown = shouldShowHifi;
          const hifiEl = document.getElementById('hifiTag');
          if (hifiEl) hifiEl.classList.toggle('visible', shouldShowHifi);
        }

        if (this.audio.isPlaying && !this.isDragging) {
          const p = this.audio.getProgress();
          document.getElementById('progressFill').style.width = `${p*100}%`;
          const current = this.audio.fmt(this.audio.getTime());
          document.getElementById('currentTimeLabel').textContent = current;
          document.getElementById('timeDisplay').textContent = `${current} / ${this.audio.fmt(this.audio.duration)}`;
          if (this.lyricEnabled) this.lyrics.update(this.audio.getTime());
        }
        const shakeOn = document.getElementById('shakeToggle')?.checked ?? true;
        if (!shakeOn) this.shakeAmount = 0;
        this.shakeAmount *= 0.88;
        if (this.shakePass) {
          this.shakePass.uniforms.uShakeX.value = (Math.random()-0.5)*this.shakeAmount*0.02;
          this.shakePass.uniforms.uShakeY.value = (Math.random()-0.5)*this.shakeAmount*0.02;
        }
        this.controls.update();

        if (this.mode === 'vinyl') {
          if (this.vinylGroup) this.vinylGroup.rotation.y += dt * 0.3;
          // 鼓点时从黑胶外边缘喷发粒子
          if (beat && this.burstParticles) {
            const burstCount = Math.floor(30 + beatStrength * 100);
            const speedMul = 0.5 + beatStrength * 1.5;
            this.burstParticles.burst(burstCount, 0, 0, this.vinylOuterRadius, this.lastCoverColor, speedMul);
          }
        } else {
          const szMul = +document.getElementById('particleSize')?.value || 0.7;
          if (this.mode !== 'spectrum') this.particles.update(dt, this.audio.freqData, beat, szMul);
          if (this.mode !== 'particle') {
            const gain = +document.getElementById('spectrumGain')?.value || 4.0;
            const smooth = +document.getElementById('spectrumSmooth')?.value || 0.55;
            this.spectrum.update(this.audio.freqData, gain, smooth);
          }
        }

        if (this.burstParticles) this.burstParticles.update(dt);

        this.bloomPass.strength = document.getElementById('bloomToggle')?.checked ? 0.6 : 0.0;
        this.composer.render();
        if (this.audio.duration) document.getElementById('durationLabel').textContent = this.audio.fmt(this.audio.duration);
      }
    }
    new App();
  </script>
</body>
</html>
